# Added by hustoj install-ssl.sh — do not edit by hand.
# 由 install-ssl.sh 从 trunk/install/hustoj-ssl.conf 模板生成，
# 换域名/证书后重跑 install-ssl.sh 即可。
# __HUSTOJ_SSL_DOMAIN__ 会被替换为实际域名；__HUSTOJ_FASTCGI_PASS__ 会被替换为
# php-fpm 地址（默认 unix socket，检测到 install 脚本改过的 9001 端口时自动换成 TCP）。

# HTTP: ACME webroot 必须在 301 之前放行，否则续期验证失败。
# 注意：正则 location 优先于前缀 location /，其余请求仍被 default vhost 处理。
server {
    listen 80;
    listen [::]:80;
    server_name __HUSTOJ_SSL_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /home/judge/src/web;
        default_type "text/plain";
    }

    location / {
        return 301 https://__HUSTOJ_SSL_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HUSTOJ_SSL_DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/hustoj/__HUSTOJ_SSL_DOMAIN__/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/hustoj/__HUSTOJ_SSL_DOMAIN__/domain.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    index       index.php;
    root        /home/judge/src/web;

    # 安全基线：upload 目录下禁止执行任何服务端脚本。
    # ^~ 前缀匹配优先于下面的 `location ~ \.php$`，即使将来有人改动正则块，
    # /upload/ 下的 php/phtml/phar 等也不会被 php-fpm 执行。
    location ^~ /upload/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
        location ~ \.(phtml|phar|php[3-7]?|cgi|pl|py|jsp|asp|aspx)$ {
            deny all;
            return 403;
        }
    }

    location / {
    }

    location ~ \.php$ {
        fastcgi_index               index.php;
        __HUSTOJ_FASTCGI_PASS__
        fastcgi_param               SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_split_path_info     ^(.+\.php)(/.+)$;
        client_max_body_size        500m;
        include                     fastcgi_params;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
